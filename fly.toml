# fly.toml app configuration file generated for gw2-randomizer-bot on 2025-11-20T22:51:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gw2-randomizer-bot'
primary_region = 'bom'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
